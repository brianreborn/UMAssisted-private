import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing — local, git-ignored keystore.properties (same pattern and
// graceful degradation as japanglify): absent on a machine => assembleRelease
// still succeeds, it just produces unsigned APKs.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// ABI splits are for real releases only (see the `splits` block below). Detected
// from the requested task names, since `splits` is variant-agnostic in AGP and
// would otherwise fragment debug builds too.
def releaseSplitsEnabled = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

// Cribbed/adapted from japanglify/app/build.gradle.kts
// FreeBSD: ensure branding of Linux natives happens before AGP executes them.
def realOs = System.getProperty('umassisted.real.os') ?: System.getProperty('os.name') ?: ''
if (realOs.equalsIgnoreCase('FreeBSD')) {
    tasks.configureEach { t ->
        if (t.name == 'preBuild' || (t.name.startsWith('process') && t.name.endsWith('Resources'))) {
            t.dependsOn(rootProject.tasks.named('brandLinuxElfs'))
        }
    }
}

android {
    namespace 'com.umassisted.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.umassisted.app'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0-alpha'
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
                // v1 is unnecessary at minSdk 30. v3 is opt-in and enables signing-key
                // *rotation* later — worth having, since losing this keystore otherwise
                // permanently blocks updates to already-installed builds.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    // Per-ABI splits so a real release ships a *set* of APKs instead of one
    // ~50MB universal blob — most of that weight is ML Kit's native OCR libs,
    // which are per-architecture. universalApk stays on for easy sideloading.
    //
    // Release-only on purpose: `splits` otherwise applies to every variant, which
    // replaces the single app-debug.apk with four split APKs and slows the
    // edit->install->test loop. Debug keeps one predictable app-debug.apk.
    splits {
        abi {
            enable releaseSplitsEnabled
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    // REQ-S3: raw user-input content (voice transcripts, OCR text) is only ever
    // logged behind BuildConfig.DEBUG, so that flag must actually exist.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
}

// Live-debugging Gradle tasks
def getAdbExecutable() {
    def sdkDir = android.sdkDirectory?.absolutePath
    if (sdkDir) {
        def adbFile = new File(sdkDir, 'platform-tools/adb')
        if (adbFile.exists()) return adbFile.absolutePath
    }
    return 'adb'
}

tasks.register('grantPermissions', Exec) {
    group = 'live debugging'
    description = 'Grants Accessibility Service and System Overlay permissions via ADB'
    commandLine getAdbExecutable(), 'shell', 'settings', 'put', 'secure', 'enabled_accessibility_services', 'com.umassisted.app/.UMAssistedAccessibilityService'
    doLast {
        exec { commandLine getAdbExecutable(), 'shell', 'settings', 'put', 'secure', 'accessibility_enabled', '1' }
        exec { commandLine getAdbExecutable(), 'shell', 'appops', 'set', 'com.umassisted.app', 'SYSTEM_ALERT_WINDOW', 'allow' }
    }
    ignoreExitValue = true
}

tasks.register('launchApp', Exec) {
    group = 'live debugging'
    description = 'Launches MainActivity on connected ADB device'
    commandLine getAdbExecutable(), 'shell', 'am', 'start', '-n', 'com.umassisted.app/.MainActivity'
    ignoreExitValue = true
}

tasks.register('liveDebug') {
    group = 'live debugging'
    description = 'Builds, installs debug APK, grants permissions, and launches app on ADB device'
    dependsOn 'installDebug'
    finalizedBy 'grantPermissions', 'launchApp'
}

tasks.register('streamLogs', Exec) {
    group = 'live debugging'
    description = 'Tails ADB logcat output filtered for com.umassisted.app'
    commandLine getAdbExecutable(), 'logcat', '-v', 'time', 'com.umassisted.app:V', 'UMAssisted:V', 'AndroidRuntime:E', '*:S'
}

tasks.register('captureScreen', Exec) {
    group = 'live debugging'
    description = 'Captures screen using ~/UMAssisted/tools/capture_screen.sh'
    commandLine 'bash', "${rootProject.rootDir}/../UMAssisted/tools/capture_screen.sh", 'live_debug', 'misc'
    ignoreExitValue = true
}

